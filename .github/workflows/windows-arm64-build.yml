name: windows-arm64-build

on:
  push:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "app/**"
      - "include/**"
      - "src/**"
      - "external/**"
      - "model_specs/**"
      - "scripts/build_windows_arm64.ps1"
      - ".github/workflows/windows-arm64-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "app/**"
      - "include/**"
      - "src/**"
      - "external/**"
      - "model_specs/**"
      - "scripts/build_windows_arm64.ps1"
      - ".github/workflows/windows-arm64-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Windows ARM64 CPU
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check loader/spec sync
        shell: pwsh
        run: |
          python tools/check_loader_catalog_sync.py --self-test
          python tools/check_loader_catalog_sync.py

      - name: Build
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "audio-cpp-arm64-build.log"
          try {
            .\scripts\build_windows_arm64.ps1 -Version ci -Clean *> $log
          }
          catch {
            Write-Host "::error::Windows ARM64 build failed. Showing the final 300 log lines."
            Get-Content -LiteralPath $log -Tail 300
            throw
          }
          Get-Content -LiteralPath $log -Tail 80

      - name: Validate ARM64 PE machine type
        shell: pwsh
        run: |
          function Get-PeMachine([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }

          $bin = ".\build\windows-arm64-cpu-release\bin"
          foreach ($name in @("audiocpp_cli.exe", "audiocpp_server.exe", "audiocpp_gguf.exe")) {
            $path = Join-Path $bin $name
            if (-not (Test-Path $path)) {
              throw "Missing $path"
            }
            $machine = Get-PeMachine $path
            if ($machine -ne 0xAA64) {
              throw "$name is not ARM64 PE (machine=0x$('{0:X4}' -f $machine))"
            }
            Write-Host "$name => ARM64 (0xAA64)"
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: audio-ci-bin-windows-arm64-cpu
          path: build/windows-arm64-cpu-release/bin/*
          if-no-files-found: error
