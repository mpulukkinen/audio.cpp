name: Tag v0.1.11 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create v0.1.11 tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.11 >/dev/null 2>&1; then
            echo "v0.1.11 already exists"
            exit 0
          fi
          git tag v0.1.11 "$GITHUB_SHA"
          git push origin refs/tags/v0.1.11
